<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="34" viewBox="0 0 1200 34" role="img" aria-label="Animated silver particle separator">
<defs>
  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#9aa8b7" stop-opacity="0"/><stop offset=".22" stop-color="#aebdcb" stop-opacity=".25"/><stop offset=".5" stop-color="#f0f4f8" stop-opacity=".8"/><stop offset=".78" stop-color="#aebdcb" stop-opacity=".25"/><stop offset="1" stop-color="#9aa8b7" stop-opacity="0"/></linearGradient>
  <filter id="glow"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<path d="M0 17H1200" stroke="#94a3b8" stroke-opacity=".13" stroke-width="1"/>
<path d="M0 17H1200" stroke="url(#line)" stroke-width="1.4" stroke-dasharray="210 990" filter="url(#glow)"><animate attributeName="stroke-dashoffset" values="1200;0" dur="8s" repeatCount="indefinite"/></path>
<g fill="#e8eef5" filter="url(#glow)">
  <circle cx="180" cy="17" r="1.2"><animate attributeName="cx" values="180;1020;180" dur="18s" repeatCount="indefinite"/><animate attributeName="opacity" values=".15;.9;.15" dur="4s" repeatCount="indefinite"/></circle>
  <circle cx="510" cy="17" r="1"><animate attributeName="cx" values="510;1120;510" dur="22s" repeatCount="indefinite"/><animate attributeName="opacity" values=".2;.8;.2" dur="5s" repeatCount="indefinite"/></circle>
  <circle cx="870" cy="17" r="1.3"><animate attributeName="cx" values="870;120;870" dur="20s" repeatCount="indefinite"/><animate attributeName="opacity" values=".1;.95;.1" dur="4.8s" repeatCount="indefinite"/></circle>
</g>
<g fill="#cbd5df" opacity=".55">
  <circle cx="95" cy="17" r=".8"/><circle cx="330" cy="17" r=".7"/><circle cx="690" cy="17" r=".8"/><circle cx="1080" cy="17" r=".7"/>
</g>
</svg>